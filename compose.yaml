
services:
  # שירות ה-Demo להתקשרות והדמיית תקלות
  demo-service:
    build:
      context: ./backend/demo-service
      dockerfile: Dockerfile
    container_name: demo-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  # אפליקציית ה-Next.js עם ה-Ops Agent
  ops-agent:
    build:
      context: ./ops-agent
      dockerfile: Dockerfile
    container_name: ops-agent
    ports:
      - "3000:3000"
    env_file:
      - ./ops-agent/.env
    environment:
      # פנייה פנימית בתוך רשת ה-Docker אל ה-demo-service
      - DEMO_SERVICE_URL=http://demo-service:5000
    depends_on:
      - demo-service